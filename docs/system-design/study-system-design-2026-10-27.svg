<text x="395.0" y="439" font-size="21" class="" text-anchor="middle">Appraisal pipeline</text>
<text x="395.0" y="464" font-size="17" class="secondary" text-anchor="middle">ingest_appraisal → parse, chunk, embed → study corpus</text>
<text x="395.0" y="485" font-size="17" class="secondary" text-anchor="middle">extract_fields → text/tables + configured Azure DI</text>
<text x="395.0" y="506" font-size="17" class="secondary" text-anchor="middle">Merge + validate → AI fallback for missing fields</text>
<text x="395.0" y="527" font-size="17" class="secondary" text-anchor="middle">Store typed fields, provenance and review flags</text>
<rect x="1005" y="405" width="600" height="145" rx="12" fill="white" stroke="#243242" stroke-width="2"/>
<text x="1305.0" y="439" font-size="21" class="" text-anchor="middle">Per-photo pipeline</text>
<text x="1305.0" y="464" font-size="17" class="secondary" text-anchor="middle">analyze_photo × N → structured vision calls</text>
<text x="1305.0" y="485" font-size="17" class="secondary" text-anchor="middle">Room identity + component counts + materials</text>
<text x="1305.0" y="506" font-size="17" class="secondary" text-anchor="middle">Save raw analyses, components and photo assignments</text>
<text x="1305.0" y="527" font-size="17" class="secondary" text-anchor="middle">localize_photo → optional SAM 3 boxes / masks</text>
<text x="850" y="474" font-size="18" class="accent" text-anchor="middle">PARALLEL</text>
