<text x="1382.5" y="850" font-size="17" class="secondary" text-anchor="middle">Evidence retrieval + verified citations</text>
<text x="1382.5" y="871" font-size="17" class="secondary" text-anchor="middle">Quantity / takeoff + cost estimation</text>
<text x="1382.5" y="892" font-size="17" class="secondary" text-anchor="middle">Cross-check outputs; flag uncertain results</text>
