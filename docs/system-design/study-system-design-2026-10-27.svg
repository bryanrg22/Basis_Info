<text x="840.0" y="225" font-size="17" class="secondary" text-anchor="middle">Schedules activities on basis-studies</text>
<text x="840.0" y="246" font-size="17" class="secondary" text-anchor="middle">Outbox relay delivers engineer decisions</text>
