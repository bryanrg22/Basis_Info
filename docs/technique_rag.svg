<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8A838"/></marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a948a"/></marker>
    <marker id="arrowI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b0aaa0"/></marker>
  </defs>
  <rect x="8" y="8" width="1384" height="934" fill="#242220" rx="26"/>

  <!-- ================= TOP GROUP: AGENT TOOL CALLS ================= -->
  <rect x="40" y="40" width="900" height="180" fill="#2e2b28" stroke="#4a463f" stroke-width="2" rx="20"/>
  <text x="64" y="75" font-size="24" font-weight="bold" fill="#c9c3b8">AGENT TOOL CALLS</text>

  <rect x="70" y="95" width="360" height="110" fill="#0E9F7A" rx="14"/>
  <text x="86" y="127" font-size="25" font-weight="bold" fill="#ffffff">Classification Agent</text>
  <text x="86" y="153" font-size="18" fill="#e6e0d6">asks: carpet → §1245? 5-yr?</text>
  <text x="86" y="176" font-size="18" fill="#e6e0d6">calls evidence tools mid-loop</text>
  <text x="86" y="199" font-size="18" fill="#e6e0d6">must cite chunk_id / table_id</text>

  <rect x="560" y="95" width="350" height="110" fill="#6D5BD8" rx="14"/>
  <text x="576" y="127" font-size="25" font-weight="bold" fill="#ffffff">MCP Evidence Server</text>
  <text x="576" y="153" font-size="18" fill="#e6e0d6">stdio server · 5 tools</text>
  <text x="576" y="176" font-size="18" fill="#e6e0d6">bm25 · vector · hybrid search</text>
  <text x="576" y="199" font-size="18" fill="#e6e0d6">get_table · get_chunk</text>

  <line x1="430" y1="150" x2="556" y2="150" stroke="#E8A838" stroke-width="3" marker-end="url(#arrowP)"/>
  <text x="495" y="138" font-size="17" fill="#cfc9bf" text-anchor="middle">search tools</text>

  <!-- Top-right annotation -->
  <text x="985" y="95" font-size="20" font-weight="bold" fill="#c9c3b8">Why hybrid?</text>
  <text x="985" y="128" font-size="18" fill="#e6e0d6">BM25 nails exact IRS symbols:</text>
  <text x="985" y="154" font-size="18" fill="#e6e0d6">§1245 · 168(e)(3)(B) · 57.0</text>
  <text x="985" y="180" font-size="18" fill="#e6e0d6">FAISS catches paraphrases;</text>
  <text x="985" y="206" font-size="18" fill="#e6e0d6">fusion blends both, 50/50.</text>

  <!-- ================= MIDDLE GROUP: HYBRID RETRIEVAL ================= -->
  <rect x="40" y="245" width="900" height="520" fill="#2e2b28" stroke="#4a463f" stroke-width="2" rx="20"/>
  <text x="64" y="280" font-size="24" font-weight="bold" fill="#c9c3b8">HYBRID RETRIEVAL</text>

  <rect x="70" y="300" width="390" height="115" fill="#0E9F7A" rx="14"/>
  <text x="86" y="333" font-size="25" font-weight="bold" fill="#ffffff">Custom IRS Tokenizer</text>
  <text x="86" y="360" font-size="18" fill="#e6e0d6">§1245 → [§1245, 1245]</text>
  <text x="86" y="383" font-size="18" fill="#e6e0d6">168(e)(3)(B) kept whole</text>
  <text x="86" y="406" font-size="18" fill="#e6e0d6">class 57.0 → [57.0, 57]</text>

  <rect x="500" y="300" width="390" height="115" fill="#0E9F7A" rx="14"/>
  <text x="516" y="333" font-size="25" font-weight="bold" fill="#ffffff">MiniLM-L6-v2 Embeddings</text>
  <text x="516" y="360" font-size="18" fill="#e6e0d6">SentenceTransformer · 384-d</text>
  <text x="516" y="383" font-size="18" fill="#e6e0d6">unit vectors → cosine (IP)</text>
  <text x="516" y="406" font-size="18" fill="#e6e0d6">handles paraphrased queries</text>

  <rect x="70" y="455" width="390" height="115" fill="#6D5BD8" rx="14"/>
  <text x="86" y="488" font-size="25" font-weight="bold" fill="#ffffff">BM25Okapi — Lexical</text>
  <text x="86" y="515" font-size="18" fill="#e6e0d6">rank_bm25 over IRS tokens</text>
  <text x="86" y="538" font-size="18" fill="#e6e0d6">exact code hits: 1245, 57.0</text>
  <text x="86" y="561" font-size="18" fill="#e6e0d6">bm25.pkl synced from GCS</text>

  <rect x="500" y="455" width="390" height="115" fill="#6D5BD8" rx="14"/>
  <text x="516" y="488" font-size="25" font-weight="bold" fill="#ffffff">FAISS — Semantic</text>
  <text x="516" y="515" font-size="18" fill="#e6e0d6">IndexFlatIP over unit vectors</text>
  <text x="516" y="538" font-size="18" fill="#e6e0d6">'equipment used in business'</text>
  <text x="516" y="561" font-size="18" fill="#e6e0d6">faiss.idx synced from GCS</text>

  <rect x="70" y="615" width="340" height="115" fill="#6D5BD8" rx="14"/>
  <text x="86" y="648" font-size="25" font-weight="bold" fill="#ffffff">Reference Corpus</text>
  <text x="86" y="675" font-size="18" fill="#e6e0d6">Pub 946·527·5653 · RP 87-56</text>
  <text x="86" y="698" font-size="18" fill="#e6e0d6">RSMeans 2020 cost data</text>
  <text x="86" y="721" font-size="18" fill="#e6e0d6">ingest → chunks + 2 indexes</text>

  <rect x="450" y="615" width="440" height="115" fill="#0E9F7A" rx="14"/>
  <text x="466" y="648" font-size="25" font-weight="bold" fill="#ffffff">Score Fusion — hybrid_search</text>
  <text x="466" y="675" font-size="18" fill="#e6e0d6">top_k × 2 from each index</text>
  <text x="466" y="698" font-size="18" fill="#e6e0d6">max-normalize both score sets</text>
  <text x="466" y="721" font-size="18" fill="#e6e0d6">0.5·bm25 + 0.5·vector → top-k</text>

  <!-- arrows into retrieval -->
  <line x1="620" y1="205" x2="305" y2="296" stroke="#b0aaa0" stroke-width="2.5" marker-end="url(#arrowI)"/>
  <text x="490" y="245" font-size="17" fill="#cfc9bf" text-anchor="middle">tokenize</text>
  <line x1="800" y1="205" x2="700" y2="296" stroke="#b0aaa0" stroke-width="2.5" marker-end="url(#arrowI)"/>
  <text x="785" y="255" font-size="17" fill="#cfc9bf">embed</text>

  <line x1="265" y1="415" x2="265" y2="451" stroke="#b0aaa0" stroke-width="2.5" marker-end="url(#arrowI)"/>
  <line x1="695" y1="415" x2="695" y2="451" stroke="#b0aaa0" stroke-width="2.5" marker-end="url(#arrowI)"/>

  <line x1="300" y1="570" x2="537" y2="612" stroke="#E8A838" stroke-width="3" marker-end="url(#arrowP)"/>
  <text x="375" y="600" font-size="17" fill="#cfc9bf" text-anchor="middle">lexical top-2k</text>
  <line x1="660" y1="570" x2="623" y2="611" stroke="#E8A838" stroke-width="3" marker-end="url(#arrowP)"/>
  <text x="712" y="600" font-size="17" fill="#cfc9bf" text-anchor="middle">cosine top-2k</text>

  <!-- offline ingest (dashed) -->
  <line x1="200" y1="615" x2="200" y2="574" stroke="#9a948a" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrowA)"/>
  <line x1="380" y1="615" x2="556" y2="573" stroke="#9a948a" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrowA)"/>

  <!-- ================= RIGHT GROUP: RAG WITH RECEIPTS ================= -->
  <rect x="960" y="245" width="400" height="520" fill="#2e2b28" stroke="#4a463f" stroke-width="2" rx="20"/>
  <text x="984" y="280" font-size="24" font-weight="bold" fill="#c9c3b8">RAG WITH RECEIPTS</text>

  <rect x="990" y="300" width="340" height="130" fill="#6D5BD8" rx="14"/>
  <text x="1006" y="336" font-size="25" font-weight="bold" fill="#ffffff">Whole-Table Store</text>
  <text x="1006" y="364" font-size="18" fill="#e6e0d6">tables never chunked</text>
  <text x="1006" y="388" font-size="18" fill="#e6e0d6">surrogate chunk per table</text>
  <text x="1006" y="412" font-size="18" fill="#e6e0d6">get_table(id) → full rows</text>

  <rect x="990" y="560" width="340" height="130" fill="#B8842C" rx="14"/>
  <text x="1006" y="596" font-size="25" font-weight="bold" fill="#ffffff">Citation Gate</text>
  <text x="1006" y="624" font-size="18" fill="#e6e0d6">0 citations → needs_review</text>
  <text x="1006" y="648" font-size="18" fill="#e6e0d6">3+ citations → conf 0.9</text>
  <text x="1006" y="672" font-size="18" fill="#e6e0d6">no evidence, no claim</text>

  <line x1="890" y1="645" x2="986" y2="410" stroke="#E8A838" stroke-width="3" marker-end="url(#arrowP)"/>
  <line x1="1160" y1="430" x2="1160" y2="556" stroke="#E8A838" stroke-width="3" marker-end="url(#arrowP)"/>
  <text x="1172" y="500" font-size="17" fill="#cfc9bf">full table rows</text>

  <!-- ================= LEGEND ================= -->
  <line x1="60" y1="830" x2="130" y2="830" stroke="#E8A838" stroke-width="3" marker-end="url(#arrowP)"/>
  <text x="140" y="836" font-size="17" fill="#cfc9bf">primary flow</text>
  <line x1="330" y1="830" x2="400" y2="830" stroke="#b0aaa0" stroke-width="2.5" marker-end="url(#arrowI)"/>
  <text x="410" y="836" font-size="17" fill="#cfc9bf">internal step</text>
  <line x1="610" y1="830" x2="680" y2="830" stroke="#9a948a" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrowA)"/>
  <text x="690" y="836" font-size="17" fill="#cfc9bf">offline ingest / GCS sync</text>
</svg>
