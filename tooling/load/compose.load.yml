# Load-test stack (docs/perf/LOAD_TESTING.md section 5): Postgres with pg_stat_statements and
# the Temporal dev server, on ports that do not collide with docker-compose.yml or other
# local stacks. The API, the worker and the relay run as host processes (stack.sh), so the
# worker can be the fake-provider one and each process can be measured on its own.
#
#   docker compose -p basis-load -f tooling/load/compose.load.yml up -d
name: basis-load
services:
  postgres:
    image: pgvector/pgvector:pg16
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=250  # slow-query log: anything over 250 ms
    environment:
      POSTGRES_USER: basis
      POSTGRES_PASSWORD: basis  # local load tests only  # pragma: allowlist secret
      POSTGRES_DB: basis
    ports:
      - "5561:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basis -d basis"]
      interval: 2s
      timeout: 3s
      retries: 30

  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7261:7233"
      - "8261:8233"
