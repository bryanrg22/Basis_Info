services:
  backend:
    build:
      context: ./backEnd
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backEnd:/app
    env_file:
      - ./backEnd/.env
    environment:
      - PYTHONPATH=/app/agentic
    command: uvicorn agentic.api.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  worker:
    build:
      context: ./backEnd
      dockerfile: Dockerfile
    volumes:
      - ./backEnd:/app
    env_file:
      - ./backEnd/.env
    environment:
      - PYTHONPATH=/app/agentic
    command: python -m agentic.workers.job_worker
    depends_on:
      - backend
    restart: unless-stopped
