// Capture the actual hover state before drop clears it, for visual CSS regression checks.
let capturedDrop=null;const renderRoomsFixture=BasisLive.render;

root.addEventListener('drop',e=>{
 const target=e.target.closest('.placement-room.placement-drop-active');if(!target)return;
 const preview=target.cloneNode(true);preview.removeAttribute('data-placement-room');preview.style.transition='none';
 preview.querySelectorAll('button,a').forEach(el=>{el.removeAttribute('data-live');el.removeAttribute('href');el.setAttribute('tabindex','-1')});
 {
  const section=document.createElement('section');section.className='workspace';section.dataset.screen='rooms';section.style.cssText='display:block;margin:24px auto;max-width:1200px;padding:24px';
  section.innerHTML='<h2>Captured destination while dragging</h2><p>The real drag handler applied this state before the drop.</p>';
  section.append(preview);root.querySelector('[data-drop-capture]')?.remove();section.dataset.dropCapture='true';capturedDrop=section;
 }
},true);
