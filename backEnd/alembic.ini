# Alembic configuration for the basis database (S1_SPEC §3).
#
# The database URL is never stored here. env.py takes it from, in order:
#   1. config.attributes["database_url"] (set programmatically by tests),
#   2. the ALEMBIC_DATABASE_URL environment variable,
#   3. basis.config Settings.database_url (DATABASE_URL; BASIS_ENV must be set, and only
#      BASIS_ENV=dev reads backEnd/.env).
#
# Run from backEnd/:
#   uv run alembic upgrade head
#   uv run alembic check          # fails if the models and the migrations disagree

[alembic]
script_location = %(here)s/basis/db/alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff_format, ruff_check
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_check.type = exec
ruff_check.executable = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
