[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "basis"
version = "0.1.0"
description = "Basis cost segregation platform: API, Temporal workflow, and pipeline activities"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.1",
    "firebase-admin>=7.7.0",
    "google-cloud-storage>=3.17.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy[asyncio]>=2.1",
    "temporalio==1.34.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.hatch.build.targets.wheel]
packages = ["basis"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.0",
    "testcontainers[postgres]>=4.15.0",
]
legacy = [
    "azure-ai-documentintelligence>=1.0.0b1",
    "faiss-cpu>=1.7.4",
    "fastapi>=0.109.0",
    "firebase-admin>=6.0.0",
    "google-cloud-storage>=2.0.0",
    "httpx>=0.27.0",
    "jsonlines>=4.0.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "langsmith>=0.1.0",
    "mcp>=1.0.0,<2",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "pdf2image>=1.16.0",
    "pdfplumber>=0.10.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.0",
    "rank-bm25>=0.2.2",
    "replicate>=0.25.0",
    "rich>=13.0.0",
    "sentence-transformers>=2.2.0",
    "slowapi>=0.1.9",
    "tenacity>=8.0.0",
    "tiktoken>=0.5.0",
    "typer>=0.9.0",
    "uvicorn>=0.27.0",
]

[tool.uv]
# Until agentic/, evidence_layer/ and vision_layer/ are migrated into basis/ (stage S3),
# a bare `uv sync` / `uv run pytest` must be able to run their suites, so the legacy
# group is installed by default. Production images install with `--no-default-groups`.
default-groups = ["dev", "legacy"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "agentic/tests", "evidence_layer/tests", "vision_layer/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "regression: guards a specific bug that was fixed; never delete without a stated reason",
    "legacy: test from agentic/, evidence_layer/ or vision_layer/ (applied automatically)",
    "integration: needs a real external dependency such as a Postgres container",
    "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Lint and format only the new package and its tests; the legacy packages keep their
# own style until they are migrated into basis/.
extend-exclude = ["agentic", "evidence_layer", "vision_layer", "scripts", "files"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["basis"]

[tool.mypy]
python_version = "3.12"
files = ["basis"]
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
# Settings.env is required and read through the BASIS_ENV alias by design.
warn_required_dynamic_aliases = false
