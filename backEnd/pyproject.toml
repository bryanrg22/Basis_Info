[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "basis"
version = "0.4.0"
description = "Basis cost segregation platform: API, Temporal workflow, and pipeline activities"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=1.17.0",
    "asyncpg>=0.32.0",
    "azure-ai-documentintelligence>=1.0.2",
    "azure-core[aio]>=1.36",
    "fastapi>=0.161.1",
    "firebase-admin>=7.7.0",
    "google-cloud-storage>=3.17.1",
    "httpx>=0.28.1",
    "numpy>=2",
    "openai>=3.37.0",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.1",
    "pillow>=12.3.0",
    "pydantic>=2",
    "pydantic-settings>=2.16.1",
    "pymupdf>=1.26",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.2.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "temporalio==1.34.0",
    "tiktoken>=0.9",
    "torch>=2.14",
    "uvicorn[standard]>=0.54.0",
]

[tool.hatch.build.targets.wheel]
packages = ["basis"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pillow>=12",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.2",
    "schemathesis>=4.32.4",
    "testcontainers[postgres]>=4.15.0",
]
# Load testing (tooling/load, docs/perf/LOAD_TESTING.md): uv sync --group load
load = [
    "locust>=2.47.0",
]

[tool.uv]
default-groups = ["dev"]

# Linux (the Cloud Run image and CI) installs the CPU-only torch wheel: the PyPI Linux
# wheel pulls about 4 GB of CUDA libraries that a GPU-less Cloud Run instance never loads.
# macOS and Windows keep PyPI, whose wheels there are already CPU-only. A source only
# applies to a direct dependency, which is why torch is listed above.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "regression: guards a specific bug that was fixed; never delete without a stated reason",
    "integration: needs a real external dependency such as a Postgres container",
    "slow: takes more than a few seconds",
    "eval_data: needs the private eval data (BASIS_EVAL_DATA_DIR); skipped without it and deselected in CI",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["files"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Generated (evals/appraisal/uad36_spec.py): the MISMO xPaths are longer than a line.
"**/basis/extraction/uad36_map.py" = ["E501"]
# The error-code document's lookup table is a Markdown table inside a string.
"**/basis/errors/catalogue.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["basis", "evals", "tests"]

[tool.mypy]
python_version = "3.12"
files = ["basis", "evals"]
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
# Settings.env is required and read through the BASIS_ENV alias by design.
warn_required_dynamic_aliases = false
