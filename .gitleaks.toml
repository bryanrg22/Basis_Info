# gitleaks configuration (CI secrets-scan). Extends the default rules; the allowlist names
# findings that are fake test values by their fingerprint (commit:file:rule:line), because
# gitleaks scans the pull request's commit history, where a later edit does not remove them.
[extend]
useDefault = true

[allowlist]
description = "fake test values"
fingerprints = [
  # A placeholder Replicate token in a settings unit test (replaced by a low-entropy value).
  "e7efbb2bc628904fdf6665fb66c578747f875122:backEnd/tests/unit/config/test_settings.py:generic-api-key:359",
]
